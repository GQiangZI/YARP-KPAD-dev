name: Recover exact Skyward 306 drivers from stock (SOURCE ONLY)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-skyward-306-drivers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrate-skyward-turner-306
  cancel-in-progress: false

jobs:
  extract:
    if: github.repository == 'GQiangZI/YARP-KPAD-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download complete stock 306 Fastboot archive and check published MD5
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          df -h .
          test "$(df --output=avail -B1 . | tail -1 | tr -d ' ')" -gt 13000000000
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 2400 \
            --speed-limit 32768 --speed-time 90 \
            'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.306.0.WAOCNXM/turner_images_OS3.0.306.0.WAOCNXM_20260528.0000.00_16.0_cn_f782a8218c.tgz' \
            -o stock306.tgz
          echo 'f782a8218c67bce2c88af4b67564904c  stock306.tgz' | md5sum -c -
          if ! command -v lz4 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y lz4
          fi
      - name: Read only the vendor_boot member without unpacking or executing firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, shutil, tarfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ["RUNNER_TEMP"])
          out = root / "stock306" / "vendor_boot.img"
          out.parent.mkdir(exist_ok=True)
          found = 0
          with tarfile.open(root / "stock306.tgz", "r|gz") as archive:
              for member in archive:
                  path = PurePosixPath(member.name)
                  if path.name != "vendor_boot.img" or path.parent.name != "images":
                      continue
                  if found or not member.isfile() or not 0 < member.size <= 67108864:
                      raise SystemExit("Unexpected or duplicate vendor_boot image")
                  with archive.extractfile(member) as src, out.open("xb") as dst:
                      shutil.copyfileobj(src, dst)
                  if out.stat().st_size != member.size:
                      raise SystemExit("Incomplete vendor_boot extraction")
                  found += 1
          if found != 1:
              raise SystemExit("Missing stock vendor_boot")
          print("Extracted stock vendor_boot:", out.stat().st_size)
          PY
          sha256sum "$RUNNER_TEMP/stock306/vendor_boot.img"
          rm "$RUNNER_TEMP/stock306.tgz"
      - name: Require exact match to all Skyward reference bytes
        run: |
          set -euo pipefail
          python3 tools/integrate_stock_306_modules.py extract \
            "$RUNNER_TEMP/stock306/vendor_boot.img" "$RUNNER_TEMP/verified-modules"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-turner-306-module-set
          path: ${{ runner.temp }}/verified-modules/
          if-no-files-found: error
          retention-days: 1
  integrate:
    needs: extract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: verified-turner-306-module-set
          path: ${{ runner.temp }}/verified-modules
      - name: Recheck and replace only the complete driver set
        run: |
          set -euo pipefail
          python3 tools/integrate_stock_306_modules.py install \
            "$RUNNER_TEMP/verified-modules" --tree . --report analysis/SKYWARD_MODULES_APPLIED.json
          python3 tools/check_skyward_module_set.py --tree .
          python3 tools/check_turner_inputs.py
      - name: Commit only the verified binary modules and audit record
        run: |
          set -euo pipefail
          git add -A -- recovery/root/lib/modules analysis/SKYWARD_MODULES_APPLIED.json
          git diff --cached --check
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              recovery/root/lib/modules/*.ko|analysis/SKYWARD_MODULES_APPLIED.json) ;;
              *) echo "::error::unexpected changed path $file"; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'turner: import exact Skyward 306 driver bytes recovered from stock Fastboot archive [skip ci]'
            git push origin HEAD:main
          fi
          echo '### Verified Skyward-identical 274-module set (source only)' >> "$GITHUB_STEP_SUMMARY"
          echo 'No YARP build, flash or hardware verification.' >> "$GITHUB_STEP_SUMMARY"
